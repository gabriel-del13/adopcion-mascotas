        RequestTemplates: { application/json: '{"statusCode": 200}' }
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'authorization,content-type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # ----- /decision (FnDecision) -----
  ResDecision:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: decision

  MetodoMostrarDecision:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResDecision
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnDecision.Arn}/invocations"

  MetodoConfirmarDecision:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResDecision
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnDecision.Arn}/invocations"

  MetodoOpcionesDecision:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ResDecision
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode": 200}' }
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'authorization,content-type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  # ---------------------------------------------------------------------
  # Deployment inicial + Stage.s
  # ---------------------------------------------------------------------
  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MetodoListarAnimales
      - MetodoOpcionesAnimales
      - MetodoObtenerAnimal
      - MetodoOpcionesAnimalId
      - MetodoListarGuarderias
      - MetodoOpcionesGuarderias
      - MetodoCrearAnimal
      - MetodoOpcionesGuarderiaAnimales
      - MetodoEditarAnimal
      - MetodoEliminarAnimal
      - MetodoOpcionesGuarderiaAnimalId
      - MetodoSubirFoto
      - MetodoOpcionesGuarderiaAnimalFotos
      - MetodoListarSolicitudesGuarderia
      - MetodoOpcionesGuarderiaSolicitudes
      - MetodoAceptarSolicitud
      - MetodoOpcionesAceptarSolicitud
      - MetodoRechazarSolicitud
      - MetodoOpcionesRechazarSolicitud
      - MetodoActualizarPerfilGuarderia
      - MetodoOpcionesGuarderiaPerfil
      - MetodoCrearSolicitud
      - MetodoOpcionesSolicitudes
      - MetodoBorrarCuenta
      - MetodoOpcionesCliente
      - MetodoObtenerPerfilCliente
      - MetodoActualizarPerfilCliente
      - MetodoOpcionesClientePerfil
      - MetodoHistorialCliente
      - MetodoCrearSolicitudCliente
      - MetodoOpcionesClienteSolicitudes
      - MetodoListarGuarderiasPendientes
      - MetodoOpcionesAdminPendientes
      - MetodoAprobarGuarderia
      - MetodoOpcionesAdminAprobar
      - MetodoRechazarGuarderia
      - MetodoOpcionesAdminRechazar
      - MetodoMostrarDecision
      - MetodoConfirmarDecision
      - MetodoOpcionesDecision
    Properties:
      RestApiId: !Ref RestApi

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      StageName: !Ref Entorno
      # Techo de gasto: por encima de esto, API Gateway responde 429 en vez
      # de seguir invocando Lambda.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

Outputs:
  RestApiId:
    Value: !Ref RestApi

  ApiEndpoint:
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Entorno}"
