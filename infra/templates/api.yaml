AWSTemplateFormatVersion: "2010-09-09"
Description: >
  API Gateway HTTP API + seis Lambdas FastAPI/Mangum, separadas por frontera
  de permisos IAM (no por endpoint). Las seis comparten el mismo paquete zip
  (backend/api) y solo cambia el Handler de cada una. Depende de
  dynamodb.yaml, auth.yaml (importa tablas y User Pool), notificaciones.yaml
  (importa la cola y el tema de alertas) y fotos.yaml (importa los dos
  buckets de fotos).

Parameters:
  Proyecto:
    Type: String
    Default: adopcion-mascotas

  Entorno:
    Type: String
    AllowedValues: [dev, prod]

  CodigoS3Bucket:
    Type: String
    Description: Bucket con el zip de la API (backend/api), compartido por las cinco funciones.

  CodigoS3KeyApi:
    Type: String
    Description: Key del zip dentro de CodigoS3Bucket.

Resources:
  # ---------------------------------------------------------------------
  # API Gateway HTTP API + autorizador JWT contra el User Pool
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Proyecto}-${Entorno}-api"
      ProtocolType: HTTP

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: !Sub "${Proyecto}-${Entorno}-jwt"
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Issuer: !ImportValue
          Fn::Sub: "${Proyecto}-${Entorno}-user-pool-issuer"
        Audience:
          - !ImportValue
            Fn::Sub: "${Proyecto}-${Entorno}-app-client-cliente"
          - !ImportValue
            Fn::Sub: "${Proyecto}-${Entorno}-app-client-guarderia"
          - !ImportValue
            Fn::Sub: "${Proyecto}-${Entorno}-app-client-admin"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      # Techo de gasto: por encima de esto, API Gateway responde 429 en vez
      # de seguir invocando Lambda.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ---------------------------------------------------------------------
  # Pública de lectura: catálogo y fichas. Sin autenticación, solo lectura.
  # ---------------------------------------------------------------------
  
  FnLecturaPublica:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-lectura-publica"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.lectura_publica.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }

  LogGroupLecturaPublica:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnLecturaPublica}"
      RetentionInDays: 30

  PermisoApiLecturaPublica:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnLecturaPublica
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionLecturaPublica:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnLecturaPublica.Arn
      PayloadFormatVersion: "2.0"

  RutaListarAnimales:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /animales"
      Target: !Sub "integrations/${IntegracionLecturaPublica}"

  RutaFichaAnimal:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /animales/{animal_id}"
      Target: !Sub "integrations/${IntegracionLecturaPublica}"

  RutaListarGuarderias:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /guarderias"
      Target: !Sub "integrations/${IntegracionLecturaPublica}"

  # ---------------------------------------------------------------------
  # Pública de escritura: crear solicitud anónima. Sin autenticación (la
  # protección de esta ruta es WAF, fase pendiente); solo puede escribir,
  # nunca leer.
  # ---------------------------------------------------------------------
  
  FnEscrituraPublica:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-escritura-publica"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.escritura_publica.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }
          TABLA_SOLICITUDES: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-solicitudes-nombre" }
          NOTIFICADOR: sqs
          COLA_NOTIFICACIONES_URL: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-cola-notificaciones-url" }
          # Referencia al propio HttpApi de este stack (no Fn::ImportValue):
          # evita una dependencia circular con notificaciones.yaml, que ya
          # depende de esta cola en sentido contrario.
          API_BASE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  LogGroupEscrituraPublica:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnEscrituraPublica}"
      RetentionInDays: 30

  PermisoApiEscrituraPublica:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnEscrituraPublica
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionEscrituraPublica:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnEscrituraPublica.Arn
      PayloadFormatVersion: "2.0"

  RutaCrearSolicitud:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /solicitudes"
      Target: !Sub "integrations/${IntegracionEscrituraPublica}"

  # ---------------------------------------------------------------------
  # Privada de cliente: perfil e historial. JWT + grupo CLIENTE (comprobado
  # en el código, IAM solo llega hasta la tabla y el índice).
  # ---------------------------------------------------------------------
  
  FnCliente:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-cliente"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.cliente.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }
          TABLA_SOLICITUDES: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-solicitudes-nombre" }
          NOTIFICADOR: sqs
          COLA_NOTIFICACIONES_URL: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-cola-notificaciones-url" }
          API_BASE_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
          USER_POOL_ID: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-user-pool-id" }

  LogGroupCliente:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnCliente}"
      RetentionInDays: 30

  PermisoApiCliente:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnCliente
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionCliente:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnCliente.Arn
      PayloadFormatVersion: "2.0"

  RutaObtenerPerfilCliente:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /cliente/perfil"
      Target: !Sub "integrations/${IntegracionCliente}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaActualizarPerfilCliente:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /cliente/perfil"
      Target: !Sub "integrations/${IntegracionCliente}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaHistorialCliente:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /cliente/solicitudes"
      Target: !Sub "integrations/${IntegracionCliente}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaCrearSolicitudCliente:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /cliente/solicitudes"
      Target: !Sub "integrations/${IntegracionCliente}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaBorrarCuentaCliente:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /cliente"
      Target: !Sub "integrations/${IntegracionCliente}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # ---------------------------------------------------------------------
  # Privada de guardería: publicar animales, ver solicitudes recibidas. JWT +
  # grupo GUARDERIA, y la aprobación (estado APROBADA) se comprueba en código.
  # ---------------------------------------------------------------------
  
  FnGuarderia:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-guarderia"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.guarderia.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }
          TABLA_SOLICITUDES: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-solicitudes-nombre" }
          BUCKET_FOTOS_ORIGINALES: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-bucket-fotos-originales-nombre" }
          BUCKET_FOTOS_DERIVADAS: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-bucket-fotos-derivadas-nombre" }

  LogGroupGuarderia:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnGuarderia}"
      RetentionInDays: 30

  PermisoApiGuarderia:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnGuarderia
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionGuarderia:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnGuarderia.Arn
      PayloadFormatVersion: "2.0"

  RutaCrearAnimal:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /guarderias/{guarderia_id}/animales"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaActualizarPerfilGuarderia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /guarderia/perfil"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaEditarAnimal:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /guarderias/{guarderia_id}/animales/{animal_id}"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaEliminarAnimal:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /guarderias/{guarderia_id}/animales/{animal_id}"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaSubirFoto:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /guarderias/{guarderia_id}/animales/{animal_id}/fotos"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaListarSolicitudesGuarderia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /guarderias/{guarderia_id}/solicitudes"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaAceptarSolicitud:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /guarderias/{guarderia_id}/solicitudes/{animal_id}/aceptar"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaRechazarSolicitud:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /guarderias/{guarderia_id}/solicitudes/{animal_id}/rechazar"
      Target: !Sub "integrations/${IntegracionGuarderia}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # ---------------------------------------------------------------------
  # Administrativa: aprobar/rechazar guarderías. JWT + grupo ADMIN.
  # ---------------------------------------------------------------------
  
  FnAdmin:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-admin"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.admin.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }

  LogGroupAdmin:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnAdmin}"
      RetentionInDays: 30

  PermisoApiAdmin:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnAdmin
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionAdmin:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnAdmin.Arn
      PayloadFormatVersion: "2.0"

  RutaListarGuarderiasPendientes:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /admin/guarderias/pendientes"
      Target: !Sub "integrations/${IntegracionAdmin}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaAprobarGuarderia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/guarderias/{sub}/aprobar"
      Target: !Sub "integrations/${IntegracionAdmin}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RutaRechazarGuarderia:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/guarderias/{sub}/rechazar"
      Target: !Sub "integrations/${IntegracionAdmin}"
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # ---------------------------------------------------------------------
  # Decisión de solicitud: enlaces de aceptar/rechazar del correo a la
  # guardería. Sin JWT: la autorización es un token de un solo uso que
  # verifica el propio código. Permisos mínimos y distintos de los cinco anteriores: nada
  # de Scan/Query, solo las claves exactas de una solicitud y de un animal
  # ---------------------------------------------------------------------
  
  FnDecision:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-decision"
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 10
      Handler: app.handlers.decision.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code: { S3Bucket: !Ref CodigoS3Bucket, S3Key: !Ref CodigoS3KeyApi }
      Environment:
        Variables:
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }
          TABLA_SOLICITUDES: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-solicitudes-nombre" }

  LogGroupDecision:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnDecision}"
      RetentionInDays: 30

  # Alarma sobre los intentos con token inválido. Va aquí, no en notificaciones.yaml, porque depende del log
  # group de FnDecision, creado justo arriba — notificaciones.yaml se
  # despliega antes que este stack.
  FiltroTokenInvalido:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupDecision
      FilterPattern: "TOKEN_INVALIDO"
      MetricTransformations:
        - MetricName: TokenDecisionInvalido
          MetricNamespace: !Sub "${Proyecto}-${Entorno}"
          MetricValue: "1"

  AlarmaTokenInvalido:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Proyecto}-${Entorno}-decision-token-invalido"
      AlarmDescription: Varios intentos de usar un enlace de decisión con token inválido en poco tiempo.
      Namespace: !Sub "${Proyecto}-${Entorno}"
      MetricName: TokenDecisionInvalido
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tema-alertas-operativas-arn" }

  PermisoApiDecision:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnDecision
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  IntegracionDecision:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FnDecision.Arn
      PayloadFormatVersion: "2.0"

  RutaMostrarDecision:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /decision"
      Target: !Sub "integrations/${IntegracionDecision}"

  RutaConfirmarDecision:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /decision"
      Target: !Sub "integrations/${IntegracionDecision}"

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
