AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fotos de animales: bucket de originales (destino de las subidas
  presignadas), bucket de derivadas (miniaturas generadas) y Lambda de
  thumbnails (imagen de contenedor, Pillow) disparada por el evento de
  subida. 
Parameters:
  Proyecto:
    Type: String
    Default: adopcion-mascotas

  Entorno:
    Type: String
    AllowedValues: [dev, prod]

  ImagenThumbnails:
    Type: String
    Description: >
      URI completa de la imagen en ECR (repositorio:tag) que deja
      build-thumbnails-image.sh, sobre el repositorio de artefactos.yaml.

Resources:
  RolThumbnails:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Proyecto}-${Entorno}-thumbnails-rol"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: procesar-fotos
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${Proyecto}-${Entorno}-fotos-originales-${AWS::AccountId}/animales/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${Proyecto}-${Entorno}-fotos-derivadas-${AWS::AccountId}/animales/*"
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-arn" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  FnThumbnails:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-thumbnails"
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 1536
      Timeout: 30
      Role: !GetAtt RolThumbnails.Arn
      Code:
        ImageUri: !Ref ImagenThumbnails
      Environment:
        Variables:
          BUCKET_FOTOS_DERIVADAS: !Sub "${Proyecto}-${Entorno}-fotos-derivadas-${AWS::AccountId}"
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }

  LogGroupThumbnails:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnThumbnails}"
      RetentionInDays: 30

  PermisoS3InvocaThumbnails:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnThumbnails
      Principal: s3.amazonaws.com
      SourceAccount: !Ref "AWS::AccountId"
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${Proyecto}-${Entorno}-fotos-originales-${AWS::AccountId}"

  BucketFotosOriginales:
    Type: AWS::S3::Bucket
    DependsOn: PermisoS3InvocaThumbnails
    Properties:
      BucketName: !Sub "${Proyecto}-${Entorno}-fotos-originales-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abortar-multiparte-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: animales/
            Function: !GetAtt FnThumbnails.Arn

  BucketFotosDerivadas:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Proyecto}-${Entorno}-fotos-derivadas-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abortar-multiparte-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

Outputs:
  BucketFotosOriginalesNombre:
    Value: !Ref BucketFotosOriginales
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-originales-nombre"
  BucketFotosOriginalesArn:
    Value: !GetAtt BucketFotosOriginales.Arn
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-originales-arn"
  BucketFotosDerivadasNombre:
    Value: !Ref BucketFotosDerivadas
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-derivadas-nombre"
  BucketFotosDerivadasArn:
    Value: !GetAtt BucketFotosDerivadas.Arn
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-derivadas-arn"
