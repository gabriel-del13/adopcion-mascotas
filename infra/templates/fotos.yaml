AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fotos de animales: bucket de originales (destino de las subidas
  presignadas), bucket de derivadas (miniaturas generadas) y Lambda de
  thumbnails (imagen de contenedor, Pillow) disparada por el evento de
  subida. Depende de dynamodb.yaml (ARN de la tabla catalogo) y de
  artefactos.yaml (URI de la imagen ya subida a ECR: el repositorio vive ahí,
  no aquí, para evitar repetición — ver artefactos.yaml). Nada de
  api.yaml: es quien importa de aquí (permisos S3 de RolGuarderia), así que
  la dependencia inversa crearía un ciclo.

Parameters:
  Proyecto:
    Type: String
    Default: adopcion-mascotas

  Entorno:
    Type: String
    AllowedValues: [dev, prod]

  ImagenThumbnails:
    Type: String
    Description: >
      URI completa de la imagen en ECR (repositorio:tag) que deja
      build-thumbnails-image.sh, sobre el repositorio de artefactos.yaml.

Resources:
  # ---------------------------------------------------------------------
  # Lambda primero: el bucket de originales necesita el permiso de
  # invocación (más abajo) antes de poder activar su notificación, y ese
  # permiso necesita que la función ya exista.
  # ---------------------------------------------------------------------
  FnThumbnails:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Proyecto}-${Entorno}-thumbnails"
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 1536
      Timeout: 30
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Code:
        ImageUri: !Ref ImagenThumbnails
      Environment:
        Variables:
          BUCKET_FOTOS_DERIVADAS: !Sub "${Proyecto}-${Entorno}-fotos-derivadas-${AWS::AccountId}"
          TABLA_CATALOGO: !ImportValue { Fn::Sub: "${Proyecto}-${Entorno}-tabla-catalogo-nombre" }
      # Sin ReservedConcurrentExecutions: mismo límite de cuenta de 10
      # ejecuciones concurrentes ya documentado en api.yaml y catalogo.yaml.

  LogGroupThumbnails:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FnThumbnails}"
      RetentionInDays: 30

  # El SourceArn se construye con !Sub, no con !GetAtt sobre el bucket, a
  # propósito: así este permiso solo depende de FnThumbnails, nunca del
  # bucket, y el bucket puede depender de este permiso (más abajo) sin
  # formar un ciclo. Es el mismo patrón que usa la documentación oficial de
  # AWS para notificaciones S3 > Lambda dentro de un único stack.
  PermisoS3InvocaThumbnails:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FnThumbnails
      Principal: s3.amazonaws.com
      SourceAccount: !Ref "AWS::AccountId"
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${Proyecto}-${Entorno}-fotos-originales-${AWS::AccountId}"

  # ---------------------------------------------------------------------
  # Buckets. Privados los dos: sin CloudFront/OAC todavía (fase pendiente,
  # igual que el bucket del catálogo), así que ninguno se publica en una URL.
  # ---------------------------------------------------------------------
  BucketFotosOriginales:
    Type: AWS::S3::Bucket
    DependsOn: PermisoS3InvocaThumbnails
    Properties:
      BucketName: !Sub "${Proyecto}-${Entorno}-fotos-originales-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abortar-multiparte-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: animales/
            Function: !GetAtt FnThumbnails.Arn

  BucketFotosDerivadas:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Proyecto}-${Entorno}-fotos-derivadas-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abortar-multiparte-incompletas
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

Outputs:
  BucketFotosOriginalesNombre:
    Value: !Ref BucketFotosOriginales
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-originales-nombre"
  BucketFotosOriginalesArn:
    Value: !GetAtt BucketFotosOriginales.Arn
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-originales-arn"
  BucketFotosDerivadasNombre:
    Value: !Ref BucketFotosDerivadas
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-derivadas-nombre"
  BucketFotosDerivadasArn:
    Value: !GetAtt BucketFotosDerivadas.Arn
    Export:
      Name: !Sub "${Proyecto}-${Entorno}-bucket-fotos-derivadas-arn"
